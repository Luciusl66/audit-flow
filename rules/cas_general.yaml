# 一般企业科目编码约定。命中项供复核，金额判断使用 Decimal。
rules:
  AR_CREDIT:
    prefixes: ["1122"]
    label: 应收账款期末贷方余额
    basis: "《企业会计准则第14号——收入》第四十一条"
    review: "核对客户合同、收款、履约及税额。确认属于尚待履约的客户对价后，按适用列报口径重分类。"
    debit: 应收账款
    credit: 合同负债
  AP_DEBIT:
    prefixes: ["2202"]
    label: 应付账款期末借方余额
    basis: "财会〔2019〕6号附件2，资产负债表「预付款项」和「应付账款」"
    review: "核对供应商合同、付款和收货。确认属于采购预付价款后，评估列报重分类。"
    debit: 预付款项
    credit: 应付账款
  CASH_DIRECTION:
    prefixes: ["1001", "1002", "1012"]
    label: 货币资金期末方向异常
    basis: "财会〔2006〕18号应用指南附录，「库存现金」「银行存款」「其他货币资金」"
    review: "核对银行对账、现金盘点、透支、未达账与红字冲销。按已确认的事项确定 AJE 或列报处理。"
  PPE_DIRECTION:
    prefixes: ["1601"]
    label: 固定资产原值期末方向异常
    basis: "《企业会计准则第4号——固定资产》第七条及财会〔2006〕18号应用指南附录"
    review: "核对卡片、计价、处置及红字冲销。确定错账及对方科目后拟定 AJE。"
  PL_UNCLOSED:
    prefixes: ["6"]
    label: 损益类科目期末有余额
    basis: "财会〔2006〕18号应用指南附录，「本年利润」及相关损益科目"
    review: "确认账表导出时点和结转政策。仅在应结转且确认漏结转后复核分录，结转前余额单独说明。"
  AR_ALLOWANCE:
    prefixes: ["1231"]
    label: 坏账准备与对应应收原值
    basis: "《企业会计准则第22号——金融工具确认和计量》第四十六、四十七、五十八及六十三条。余额上限为底稿筛查。"
    review: "核对减值底稿、应收原值、核销和备抵归属，按 CAS 22 重新计量。确认期内多提后再拟定转回。"
    debit: 坏账准备
    credit: 信用减值损失

# 仅填写经账套核对的准备科目与对应应收原值。通用科目 1231 可能覆盖多类资产。
# 客户 Adapter 可用 cas_allowance_pairs 传入该账套的专用映射。
allowance_pairs: {}
