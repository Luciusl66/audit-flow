# https://docs.maoyanqing.com/accounting/ent/cas/19.html
# https://docs.maoyanqing.com/accounting/ent/casg/19.html
schema_version: 1
cas_no: 19
name: 企业会计准则第19号——外币折算
status: distilled
rules:
  - rule_id: CAS19_TB_CURRENCY_EXCHANGE_UNCLOSED
    cas_ref: 《企业会计准则第19号——外币折算》第九至十一条及2024指南第十九章二（二）4「货币兑换」
    severity: WARNING
    target_scope: TB
    account_pattern:
      type: regex
      value: ^3002(?:[._/-][A-Z0-9][A-Z0-9._/-]*)?$
    check_type: period_end_nonzero
    condition:
      requires_context: currency_exchange_closed
      root_only: true
      tolerance: '0.00'
    suggested_entry: null
    message_template: 货币兑换汇总 ${account_code} 在结转后仍有净额 ${balance}。请确认外币余额已统一折为记账本位币，并核对期末汇兑结转。
