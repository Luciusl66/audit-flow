schema_version: 1
# status 跟踪实务卡片与规则的整体提炼进度；适用版本另行核实。
priority_basis: "一般工商业企业常规审计底稿的使用频次。P0高频、P1中频、P2低频。"
raw_source_dir: docs/cas_raw
# 正则仅匹配文件名。命中多个版本时由复核人确认报告期适用版本。
application_guides:
  general_raw_source_pattern:
    - '^(?:企业会计准则[\s_—-]*)?应用指南(?:汇编)?(?:[（(][^）)]*[）)])?\.md$'
    - '^(?:企业会计准则[\s_—-]*)?会计科目和主要账务处理(?:[（(][^）)]*[）)])?\.md$'
    - '^1\.主要科目与主要账务处理[（(]2006[）)]\.md$'
  official_url: https://www.mof.gov.cn/caizhengkuaiji/caizhengxinwen/200805/t20080519_24574.htm
