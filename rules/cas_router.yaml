schema_version: 1
# 映射适用于经确认的一般企业科目表。自定义科目由 Adapter 确认标准一级编码。
# 确认 2204 / 2205 的合同负债含义后才使用对应路由。
# 来源 https://docs.maoyanqing.com/accounting/ent/as/ 。无统一编号的项目列在 named_accounts，由 Adapter 确认代码与名称。
# 2221 的 CAS 18 参考只用于企业所得税明细。6901 的结转适用性单独判断。
# 先匹配 Adapter 已确认的科目名称，再精确匹配编码或按分隔符逐级回退。连续编码由调用方传入已确认的一级编码。
